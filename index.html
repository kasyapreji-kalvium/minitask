<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitFlow Demo - Personal Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>GitFlow Demo</h1>
      <p class="subtitle">Kalvium Git Workflow Demonstration Project</p>
    </header>

    <main class="tracker-card">
      <section class="task-input-section">
        <form id="taskForm" class="task-form" onsubmit="return false;">
          <input 
            type="text" 
            id="taskInput" 
            placeholder="What needs to be done?" 
            autocomplete="off" 
            required
          />
          <button type="submit" id="addTaskBtn" class="btn btn-primary">Add Task</button>
        </form>
      </section>

      <section class="task-stats-section">
        <span id="taskCount">0 tasks</span>
        <span id="completedCount" class="completed-badge">0 completed</span>
      </section>

      <section class="task-list-section">
        <ul id="taskList" class="task-list">
          <!-- Tasks dynamically rendered by app.js with toggle and delete controls -->
        </ul>
        <div id="emptyState" class="empty-state">
          <p>No tasks yet. Add one above to get started!</p>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>Demonstrating Feature Branch Workflow: <code>feature/task-completion-deletion</code> &rarr; <code>main</code></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
